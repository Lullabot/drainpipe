name: "Pantheon Review Apps (Async DDEV)"

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  deployments: write
  contents: read
  pull-requests: read

jobs:
  Drainpipe-Deploy-Pantheon-Multidev:
    if: contains(github.event.pull_request.labels.*.name, 'build multidev')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ddev/.drainpipe-composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ./.github/actions/drainpipe/set-env

      - uses: ./.github/actions/drainpipe/validate-terminus-timeout
        with:
          terminus_timeout_limit: ${{ vars.TERMINUS_TIMEOUT_LIMIT }}

      - name: Install and Start DDEV
        uses: ./.github/actions/drainpipe/ddev
        with:
          git-name: Drainpipe Bot
          git-email: no-reply@example.com
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Build Project
        env:
          directory: /tmp/release
        run: |
          ddev composer install
          ddev task build
          ddev task snapshot:directory directory=/tmp/release

      - name: Install Terminus in DDEV
        run: |
          set -eu
          # Version and checksum must be bumped together. Renovate updates both.
          TERMINUS_VERSION=4.3.5
          TERMINUS_SHA256=b5653c9e08329ab087d4b772a98e7a733e9a5b28f9101096d860e25fba91c8d2
          ddev exec --user root "set -eu
            curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
              https://github.com/pantheon-systems/terminus/releases/download/${TERMINUS_VERSION}/terminus.phar \
              --output /tmp/terminus.phar
            echo '${TERMINUS_SHA256}  /tmp/terminus.phar' | sha256sum -c -
            install -m 0755 /tmp/terminus.phar /usr/local/bin/terminus
            rm -f /tmp/terminus.phar"

      - name: Deploy Pantheon Review App
        uses: ./.github/actions/drainpipe/pantheon/review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          terminus-token: ${{ secrets.TERMINUS_MACHINE_TOKEN || secrets.PANTHEON_TERMINUS_TOKEN }}
          commit-message: ${{ github.sha }}
          site-name: ${{ vars.PANTHEON_SITE_NAME || secrets.PANTHEON_SITE_NAME }}
          lock-username: ${{ secrets.PANTHEON_REVIEW_USERNAME }}
          lock-password: ${{ secrets.PANTHEON_REVIEW_PASSWORD }}
          # set to "true" if you want to run the installer
          run-installer: ${{ secrets.PANTHEON_REVIEW_RUN_INSTALLER }}
          clone-from: ${{ vars.PANTHEON_CLONE_FROM || 'live' }}
          terminus-timeout-limit: ${{ env.TERMINUS_TIMEOUT_LIMIT }}
          skip-wipe-multidev: ${{ vars.PANTHEON_SKIP_WIPE_MULTIDEV }}
          async: 'true'
