name: "Security"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          git checkout "$BASE_REF"
          git checkout -

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ddev/.drainpipe-composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ./.github/actions/drainpipe/set-env

      - name: Install and Start DDEV
        uses: ./.github/actions/drainpipe/ddev
        with:
          git-name: Drainpipe Bot
          git-email: no-reply@example.com
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Build Project
        run: |
          ddev composer install

      # Generate the advisory report before the security checks so it is
      # available even when the checks fail. The script never fails the build.
      - name: Generate composer audit report
        run: |
          ddev exec env COMPOSER_AUDIT_OUTPUT=composer-audit-comment.md bash ./vendor/lullabot/drainpipe/scripts/composer-audit.sh
          if [ -s composer-audit-comment.md ]; then
            cat composer-audit-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Security Checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ddev task test:security composer_lock_diff_from="$BASE_REF" composer_lock_diff=composer-lock-diff.md

      - name: Post composer audit comment
        if: always() && hashFiles('composer-audit-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: composer-security-audit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          path: composer-audit-comment.md

      - name: Format composer lock diff comment
        if: always()
        run: |
          if [ -s composer-lock-diff.md ]; then
            printf '## Composer Lock Diff\n\n%s\n' "$(cat composer-lock-diff.md)" > composer-lock-diff-comment.md
            printf '## Composer Lock Diff\n\n%s\n' "$(cat composer-lock-diff.md)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post composer lock diff comment
        if: always() && hashFiles('composer-lock-diff-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: composer-lock-diff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          path: composer-lock-diff-comment.md

      - name: Delete composer lock diff comment
        if: always() && hashFiles('composer-lock-diff-comment.md') == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: composer-lock-diff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          delete: true

  Npm-Audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package directories come from extra.drainpipe.github.NpmAudit in
      # composer.json. The script writes no report when none are configured.
      - name: Run npm audit
        run: |
          bash .github/scripts/npm-audit.sh
          if [ -s npm-audit-comment.md ]; then
            cat npm-audit-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post npm audit comment
        if: hashFiles('npm-audit-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: npm-security-audit
          path: npm-audit-comment.md

      - name: Delete npm audit comment
        if: hashFiles('npm-audit-comment.md') == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: npm-security-audit
          delete: true

  ZizmorAnalysis:
    name: Run Zizmor Security Analysis
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zizmor
        run: pip install zizmor==1.32.0

      - name: Run Zizmor
        id: zizmor
        run: zizmor --format sarif .github > zizmor.sarif
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings
        if: steps.zizmor.outcome == 'failure'
        run: exit 1

  Gitleaks:
    name: Run Gitleaks Secret Scanning
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        id: gitleaks
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path results.sarif \
            --exit-code 1 \
            .
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Generate PR comment
        if: steps.gitleaks.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          {
            echo "## :warning: Gitleaks: potential secrets detected"
            echo ""
            echo "The following potential secrets were detected. Please review and rotate any valid credentials."
            echo ""
            echo "| Rule | File |"
            echo "|------|------|"
            jq -r '.runs[0].results[] | "| " + .ruleId + " | `" + .locations[0].physicalLocation.artifactLocation.uri + "` |"' results.sarif
            echo ""
            echo "See the [Security tab]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning) for full details."
          } > gitleaks-comment.md

      - name: Post PR comment
        if: steps.gitleaks.outcome == 'failure' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: gitleaks
          path: gitleaks-comment.md

      - name: Delete PR comment if clean
        if: steps.gitleaks.outcome == 'success' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: gitleaks
          delete: true

      - name: Fail on findings
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1
