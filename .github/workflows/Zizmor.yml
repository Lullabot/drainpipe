name: Zizmor

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Run Zizmor Security Analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter GitHub Actions paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            gha:
              - '.github/**'
              - 'drainpipe-dev/.github/**'
              - 'scaffold/github/**'

      - name: Install Zizmor
        if: steps.filter.outputs.gha == 'true'
        run: pip install zizmor==1.22.0

      - name: Run Zizmor
        id: zizmor
        if: steps.filter.outputs.gha == 'true'
        run: zizmor --format sarif .github drainpipe-dev/.github scaffold/github > zizmor.sarif
        continue-on-error: true

      - name: Upload SARIF
        if: always() && steps.filter.outputs.gha == 'true'
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings
        if: steps.filter.outputs.gha == 'true' && steps.zizmor.outcome == 'failure'
        run: exit 1
