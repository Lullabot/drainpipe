name: Test Static Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  Test-Static:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        drupal-version: [ 10, 11 ]
    steps:
      - name: Create a Drupal project
        run: composer create-project drupal/recommended-project:^${{ matrix.drupal-version }} . --ignore-platform-reqs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drainpipe
          persist-credentials: false

      - name: Setup drainpipe-dev
        run: mv drainpipe/drainpipe-dev .

      - uses: ./drainpipe/scaffold/github/actions/common/set-env

      - name: Install DDEV
        uses: ./drainpipe/scaffold/github/actions/common/ddev
        with:
          git-name: Drainpipe Bot
          git-email: no-reply@example.com

      - name: Setup Project
        run: |
          ddev config --auto
          ddev start
          ddev exec --raw composer config extra.drupal-scaffold.gitignore true
          ddev exec --raw composer config --json extra.drupal-scaffold.allowed-packages '["lullabot/drainpipe-dev", "lullabot/drainpipe"]'
          ddev exec --raw composer config --no-plugins allow-plugins.composer/installers true
          ddev exec --raw composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          ddev exec --raw composer config --no-plugins allow-plugins.lullabot/drainpipe true
          ddev exec --raw composer config --no-plugins allow-plugins.lullabot/drainpipe-dev true
          ddev exec --raw composer config repositories.drainpipe --json '{"type": "path", "url": "drainpipe", "options": {"symlink": false}}'
          ddev exec --raw composer config repositories.drainpipe-dev --json '{"type": "path", "url": "drainpipe-dev", "options": {"symlink": false}}'
          ddev exec --raw composer config minimum-stability dev
          ddev composer require "lullabot/drainpipe @dev" --with-all-dependencies
          ddev composer require "lullabot/drainpipe-dev @dev" --dev --with-all-dependencies
          # Restart is required to enable the provided Selenium containers
          ddev restart

      - name: Verify files were created
        run: |
          test -f phpcs.xml.dist
          test -f phpstan.neon.dist

      - name: Create a git repository
        run: |
          git config --global user.email "no-reply@example.com"
          git config --global user.name "Drainpipe Bot"
          git init
          echo "/drainpipe" >> .gitignore
          echo "/drainpipe-dev" >> .gitignore
          git add .
          git commit -m "Initial commit"

      - name: Fix settings.php
        run: |
          sed -i '/^.*container_yamls.*$/i /** @phpstan-ignore-next-line */' web/sites/default/settings.php

      - name: Test for untracked and modified files
        id: test_untracked
        continue-on-error: true
        run: ddev task test:untracked

      - name: Test for untracked and modified files
        run: |
          if [ "${TEST_UNTRACKED_OUTCOME}" != "failure" ]; then
            exit 1
          fi
          git add .
          git commit -m "Second commit"
          ddev task test:untracked
        env:
          TEST_UNTRACKED_OUTCOME: ${{ steps.test_untracked.outcome }}

      - name: Run Static Tests
        run: ddev task test:static

      - name: Confirm custom directories are scanned
        run: |
          set -x
          mkdir -p custom-yaml-directory
          echo 'key: value' >> custom-yaml-directory/test.yml
          ddev task test:static YAML_DIRS="custom-yaml-directory/*.yml" | tee static.log
          [[ $(grep '\[OK] All 1 YAML files contain valid syntax.' static.log | wc -l) -eq 1 ]]

      - name: Confirm Twig CS Fixer catches violations and autofix works
        run: |
          set -x
          mkdir -p web/themes/custom/test_theme/templates
          printf '{{foo}}\n' > web/themes/custom/test_theme/templates/test.html.twig
          # Should fail - spacing violation inside delimiters
          ! ddev task test:lint TWIG_DIRS="web/themes/custom/test_theme/templates"
          # Fix automatically
          ddev task test:autofix TWIG_DIRS="web/themes/custom/test_theme/templates"
          # Should pass now
          ddev task test:lint TWIG_DIRS="web/themes/custom/test_theme/templates"

      - name: Confirm front-end linting reports skipped tools and missing directories
        run: |
          set -x
          ddev task test:lint > lint.log 2>&1 || { cat lint.log; exit 1; }
          cat lint.log
          grep -q "Skipping Prettier in '.': no .prettierrc.json found." lint.log
          # A FRONTEND_DIRS entry that does not exist must fail with a clear message.
          if ddev task test:lint FRONTEND_DIRS="does/not/exist" > missing.log 2>&1; then
            cat missing.log
            exit 1
          fi
          cat missing.log
          grep -q "Front-end directory 'does/not/exist' does not exist" missing.log

      - name: Confirm front-end linting checks without writing, despite a same-named package.json script
        run: |
          set -x
          ddev exec node --version
          ddev exec yarn --version
          ddev exec npm --version
          for PM in npm yarn; do
            DIR="frontend-fixtures/$PM"
            mkdir -p "$DIR"
            # A "prettier" script that writes. Before the fix, `yarn prettier --check`
            # / `npm run prettier --check` ran this script and rewrote the files.
            printf '{\n  "name": "fixture-%s",\n  "private": true,\n  "scripts": {\n    "prettier": "prettier -w ."\n  }\n}\n' "$PM" > "$DIR/package.json"
            printf '{}\n' > "$DIR/.prettierrc.json"
            printf '.yarn\n.pnp.*\nyarn.lock\npackage-lock.json\n' > "$DIR/.prettierignore"
            printf 'const   foo = {a:1,\n  b:2}\n' > "$DIR/unformatted.js"
            if [ "$PM" = "npm" ]; then
              ddev exec -d "/var/www/html/$DIR" npm install --save-dev --no-audit --no-fund prettier@3.3.3
              test -f "$DIR/package-lock.json"
            else
              ddev exec -d "/var/www/html/$DIR" "YARN_ENABLE_IMMUTABLE_INSTALLS=false COREPACK_ENABLE_DOWNLOAD_PROMPT=0 yarn add --dev prettier@3.3.3"
              test -f "$DIR/yarn.lock"
            fi
            # Stage the fixture so any write by test:lint shows up in git diff.
            git add -f "$DIR/package.json" "$DIR/.prettierrc.json" "$DIR/.prettierignore" "$DIR/unformatted.js"

            # test:lint must fail on the unformatted file and must not modify it.
            if ddev task test:lint FRONTEND_DIRS="$DIR" > "lint-$PM.log" 2>&1; then
              cat "lint-$PM.log"
              echo "test:lint passed with an unformatted file using $PM"
              exit 1
            fi
            cat "lint-$PM.log"
            grep -q "unformatted.js" "lint-$PM.log"
            git diff --exit-code -- "$DIR"

            # test:autofix must pass --write through to Prettier (Yarn 1 drops
            # flags without `yarn exec --`), after which test:lint passes.
            ddev task test:autofix FRONTEND_DIRS="$DIR"
            if git diff --quiet -- "$DIR/unformatted.js"; then
              echo "test:autofix did not format unformatted.js using $PM"
              exit 1
            fi
            ddev task test:lint FRONTEND_DIRS="$DIR"
          done
          git reset -q -- frontend-fixtures
          rm -rf frontend-fixtures

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_result-static
          path: test_result
